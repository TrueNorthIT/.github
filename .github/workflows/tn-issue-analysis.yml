name: TN issue analysis (shared)

# Reusable workflow: a quick local-model analysis comment on an issue, run on bigmac.
# Org repos call it with:
#   jobs:
#     analyse:
#       uses: TrueNorthIT/.github/.github/workflows/tn-issue-analysis.yml@v1
#       secrets: inherit
#
# This file is public and holds plumbing only. The prompt and model settings live in the
# private TrueNorthIT/tn-local-agents kit, fetched below at a pinned tag.
#
# Who can trigger it: members of the org team named in `team` (default: local-agent-access).
# Admins manage access on that team's page; no workflow changes needed.
on:
  workflow_call:
    inputs:
      kit-ref:
        description: Tag of TrueNorthIT/tn-local-agents to run
        type: string
        default: v1.0.0
      team:
        description: Org team whose members may trigger it (team slug)
        type: string
        default: local-agent-access

jobs:
  analyse:
    # A new issue, or the `analyse` label. Who did it is checked in "Authorise".
    if: github.event.action == 'opened' || github.event.label.name == 'analyse'
    # Job-level, so skipped runs from other label changes never touch the queue.
    concurrency: tn-issue-analysis-${{ github.repository }}-${{ github.event.issue.number }}
    runs-on: [self-hosted, bigmac]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      KIT_REF: ${{ inputs.kit-ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # App token: reads the private kit, and team membership (Organization > Members: read).
      - id: kit-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.BIGMAC_APP_ID }}
          private-key: ${{ secrets.BIGMAC_APP_PRIVATE_KEY }}
          repositories: tn-local-agents
          # Least privilege: clone the kit and check team membership, nothing else.
          permission-contents: read
          permission-members: read

      # Is whoever opened the issue / added the label an active member of the team?
      # Fails closed: no team, no permission, or not a member means nobody gets through,
      # and nothing private is fetched. Outsiders get a log line only, no comment.
      - name: Authorise
        id: auth
        env:
          GH_TOKEN: ${{ steps.kit-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          TEAM: ${{ inputs.team }}
          WHO: ${{ github.event.sender.login }}
        run: |
          state=$(gh api "orgs/$ORG/teams/$TEAM/memberships/$WHO" --jq .state 2>/dev/null || true)
          if [ "$state" = "active" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$WHO is not an active member of $ORG/$TEAM; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch kit
        if: steps.auth.outputs.ok == 'true'
        env:
          TOKEN: ${{ steps.kit-token.outputs.token }}
        run: |
          rm -rf "$RUNNER_TEMP/kit-analysis"
          git -c credential.helper= \
            -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)" \
            clone -q --depth 1 --branch "$KIT_REF" https://github.com/TrueNorthIT/tn-local-agents.git "$RUNNER_TEMP/kit-analysis"
          echo "KIT_DIR=$RUNNER_TEMP/kit-analysis" >> "$GITHUB_ENV"

      - name: Analyse
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$KIT_DIR/adapters/github/run-analysis.sh" analyse

      # Posted as the app (truenorth-big-mac[bot]) so the agent can trust it later.
      - id: app
        if: steps.auth.outputs.ok == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.BIGMAC_APP_ID }}
          private-key: ${{ secrets.BIGMAC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Post
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash "$KIT_DIR/adapters/github/run-analysis.sh" post

      - name: Release claim on failure
        if: failure() && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$N" --remove-label analysis-in-progress || true

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/kit-analysis" "$RUNNER_TEMP/tn-analysis-$N"
